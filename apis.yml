aid: credit-karma
name: Credit Karma
description: Credit Karma is an AI-powered personal finance platform founded in 2007 and owned by Intuit
  since 2020, serving more than 140 million members in the US, UK and Canada. It began as a free credit-score
  and credit-monitoring destination and has grown into a broad consumer finance marketplace spanning credit
  cards, personal and auto loans, mortgages, auto and home insurance, banking (checking, savings and credit-builder
  accounts), tax filing, and identity monitoring. Credit Karma monetizes through personalized recommendations
  and lead generation rather than a public developer or partner API; it maintains no external consumer-facing
  API program. It does run an active engineering culture with 29 public open-source repositories on GitHub
  (Thrift and GraphQL tooling), a coordinated vulnerability disclosure program via HackerOne, and SOC
  2 / ISO 27001 security certifications.
